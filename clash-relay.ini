[custom]
exclude_remarks=(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)

; DNS 出站规则优先匹配
ruleset=DIRECT,[]DOMAIN,dns.alidns.com
ruleset=DIRECT,[]DOMAIN,doh.pub
ruleset=🚀 国外流量,[]IP-CIDR,1.1.1.1/32,no-resolve
ruleset=🚀 国外流量,[]IP-CIDR,1.0.0.1/32,no-resolve

ruleset=DIRECT,[]GEOIP,LAN,no-resolve

ruleset=DIRECT,[]DOMAIN-SUFFIX,haoqianwei.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,haoqianwei.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,local.rightcapital.dev
ruleset=DIRECT,[]GEOSITE,googlefcm
ruleset=DIRECT,[]GEOSITE,zoom
ruleset=DIRECT,[]DOMAIN-KEYWORD,italki
ruleset=🚀 国外流量,[]DOMAIN-KEYWORD,rightcapital
ruleset=🧚 AI,[]GEOSITE,category-ai-!cn
ruleset=🔍 Google,[]GEOSITE,google
ruleset=💬 Slack,[]GEOSITE,slack
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=☁️ Oracle,[]GEOSITE,oracle
ruleset=🚀 国外流量,[]GEOSITE,bbc
ruleset=📲 Telegram,[]GEOSITE,telegram
ruleset=📲 Telegram,[]GEOIP,telegram,no-resolve
; GitHub 优先于 Microsoft
ruleset=🚀 国外流量,[]GEOSITE,github
ruleset=Ⓜ️ 微软云盘,[]GEOSITE,onedrive
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOSITE,cn
ruleset=🚀 国外流量,[]GEOSITE,geolocation-!cn
ruleset=DIRECT,[]GEOIP,CN
ruleset=🚀 国外流量,[]FINAL

; 出口名称必须包含“出口”或“落地”，以排除自动选择；普通节点名称不要带这两个标记。
; 以下正则筛选参与订阅转换的节点；运行时 proxy-providers 需在最终 YAML 另配 use/filter。
; 出口经哪个中转组连接，由出口自身的 provider 配置决定，本 INI 不创建 relay 组。
{% set T = "`http://www.gstatic.com/generate_204`300,,50" %}
{% set R = "[]🚀 国外流量`[]🇺🇸 美国节点`[]🇯🇵 日本节点" %}

; 总入口和自动选择置顶，方便日常切换。
; 国外流量总入口：首次加载默认“♻️ 自动选择”，并列出所有节点（含出口）供手动选择。
; 基础配置的 store-selected 会保留之后的手动选择。
custom_proxy_group=🚀 国外流量`select`[]♻️ 自动选择`.*
; 自动选择只测试普通节点，排除名称包含“出口”或“落地”的节点。
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(出口|落地)).*${{ T }}

; 业务分组默认跟随“🚀 国外流量”，也可指定美国、日本节点直出。
; 手动指定出口请在“🚀 国外流量”组操作。
custom_proxy_group=🔍 Google`select`{{ R }}
custom_proxy_group=🧚 AI`select`{{ R }}
custom_proxy_group=📲 Telegram`select`{{ R }}
custom_proxy_group=💬 Slack`select`{{ R }}
custom_proxy_group=🎶 TikTok`select`{{ R }}

; 保留原来的默认直连策略。
custom_proxy_group=Ⓜ️ 微软云盘`select`[]DIRECT`{{ R }}
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`{{ R }}
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`{{ R }}
custom_proxy_group=☁️ Oracle`select`[]DIRECT`{{ R }}

; 中转组放在最后，供出口 provider 按完整组名“🇺🇸 美国节点”或“🇯🇵 日本节点”引用。
; 排除出口标记，避免将出口放进自身依赖的中转组而形成循环。
custom_proxy_group=🇺🇸 美国节点`url-test`^(?!.*(出口|落地)).*(美国|(^|[^A-Za-z])USA?([^A-Za-z]|$)|United States).*${{ T }}
custom_proxy_group=🇯🇵 日本节点`url-test`^(?!.*(出口|落地)).*(日本|(^|[^A-Za-z])JP([^A-Za-z]|$)|Japan|Tokyo|Osaka).*${{ T }}

enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=base/GeneralClashConfig.yml
