[custom]
;设置规则标志位
ruleset=🎯 国内流量,clash-classic:https://raw.githubusercontent.com/haoqianwei/my-clash-ini/refs/heads/main/haoqianwei-rule-provider.yaml
ruleset=📢 谷歌FCM,[]GEOSITE,googlefcm
ruleset=🧚 AI,[]GEOSITE,category-ai-!cn
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🔍 Google,[]GEOSITE,google
ruleset=☁️ Oracle,[]GEOSITE,oracle
ruleset=🗣️ Zoom,[]GEOSITE,zoom
ruleset=👩🏻‍🏫 italki,clash-classic:https://raw.githubusercontent.com/haoqianwei/my-clash-ini/refs/heads/main/italki-rule-provider.yaml
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=📲 Telegram,[]GEOSITE,telegram
ruleset=📲 Telegram,[]GEOIP,telegram,no-resolve
; geosite microsoft 包含 github.com，需在微软规则前拦截
ruleset=🚀 国外流量,[]GEOSITE,github
ruleset=Ⓜ️ 微软云盘,[]GEOSITE,onedrive
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=🎯 国内流量,[]GEOSITE,private
ruleset=🎯 国内流量,[]GEOSITE,cn
ruleset=🚀 国外流量,[]GEOSITE,geolocation-!cn
ruleset=🎯 国内流量,[]GEOIP,private,no-resolve
ruleset=🎯 国内流量,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位

; 1. 核心手动切换组
; 包含所有节点，同时也包含下面定义的基础自动选择分组
custom_proxy_group=🚀 国外流量`select`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇨🇳 台湾节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*

; 2. 基础自动选择分组（按国家/地区）
; 这里会自动筛选包含对应关键字的节点，并选择延迟最低的
custom_proxy_group=🇭🇰 香港节点`url-test`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*(香港|HK|Hong Kong|HKT|HKBN|HGC)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*(美国|洛杉矶|圣何塞|(^|[^A-Za-z])US([^A-Za-z]|$)|United States)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇨🇳 台湾节点`url-test`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*(台湾|TW|Taiwan|CHT|Hinet)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*(日本|JP|Japan|Tokyo|Osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50

; 3. 业务逻辑分组
custom_proxy_group=🔍 Google`select`[]🚀 国外流量`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇨🇳 台湾节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*
custom_proxy_group=🧚 AI`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇨🇳 台湾节点`[]🚀 国外流量`[]🇭🇰 香港节点`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*
custom_proxy_group=📹 YouTube`select`[]🚀 国外流量`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇨🇳 台湾节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*
custom_proxy_group=🎶 TikTok`select`[]🚀 国外流量`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇨🇳 台湾节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*
custom_proxy_group=📲 Telegram`select`[]🚀 国外流量`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇨🇳 台湾节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`^(?!.*(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)).*

