[custom]
exclude_remarks=(剩余|到期|过期|官网|套餐|重置|Traffic|Expire)

; DNS 出站规则优先匹配
ruleset=🎯 国内流量,[]DOMAIN,dns.alidns.com
ruleset=🎯 国内流量,[]DOMAIN,doh.pub
ruleset=🚀 国外流量,[]IP-CIDR,1.1.1.1/32,no-resolve
ruleset=🚀 国外流量,[]IP-CIDR,1.0.0.1/32,no-resolve

ruleset=🎯 国内流量,[]GEOIP,LAN,no-resolve

ruleset=🎯 国内流量,[]DOMAIN-SUFFIX,haoqianwei.com
ruleset=🎯 国内流量,[]DOMAIN-SUFFIX,haoqianwei.cn
ruleset=🎯 国内流量,[]DOMAIN-SUFFIX,local.rightcapital.dev
ruleset=🎯 国内流量,[]GEOSITE,googlefcm
ruleset=🎯 国内流量,[]GEOSITE,zoom
ruleset=🎯 国内流量,[]DOMAIN-KEYWORD,italki
ruleset=🚀 国外流量,[]DOMAIN-KEYWORD,rightcapital
ruleset=🧚 AI,[]GEOSITE,category-ai-!cn
ruleset=🔍 Google,[]GEOSITE,google
ruleset=💬 Slack,[]GEOSITE,slack
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=☁️ Oracle,[]GEOSITE,oracle
ruleset=🚀 国外流量,[]GEOSITE,bbc
ruleset=📲 Telegram,[]GEOSITE,telegram
ruleset=📲 Telegram,[]GEOIP,telegram,no-resolve
; GitHub 优先于 Microsoft
ruleset=🚀 国外流量,[]GEOSITE,github
ruleset=Ⓜ️ 微软云盘,[]GEOSITE,onedrive
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=🎯 国内流量,[]GEOSITE,private
ruleset=🎯 国内流量,[]GEOSITE,cn
ruleset=🚀 国外流量,[]GEOSITE,geolocation-!cn
ruleset=🎯 国内流量,[]GEOIP,CN
ruleset=🚀 国外流量,[]FINAL

{% set R = "[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇨🇳 台湾节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]💎 优选节点" %}
{% set T = "`http://www.gstatic.com/generate_204`300,,50" %}
; 手动选择
custom_proxy_group=🚀 国外流量`select`{{ R }}`.*
custom_proxy_group=💎 优选节点`select`(落地)

; 默认代理
custom_proxy_group=🔍 Google`select`[]🚀 国外流量`{{ R }}`.*
custom_proxy_group=🧚 AI`select`[]🚀 国外流量`{{ R }}`.*
custom_proxy_group=📲 Telegram`select`[]🚀 国外流量`{{ R }}`.*
custom_proxy_group=💬 Slack`select`[]🚀 国外流量`{{ R }}`.*
custom_proxy_group=🎶 TikTok`select`[]🚀 国外流量`{{ R }}`.*

; 默认直连
custom_proxy_group=Ⓜ️ 微软云盘`select`[]DIRECT`[]🚀 国外流量`{{ R }}
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 国外流量`{{ R }}
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 国外流量`{{ R }}
custom_proxy_group=☁️ Oracle`select`[]DIRECT`[]🚀 国外流量`{{ R }}`.*

custom_proxy_group=🎯 国内流量`select`[]DIRECT

; 地区测速
custom_proxy_group=🇭🇰 香港节点`url-test`(香港|HK|Hong Kong|HKT|HKBN|HGC){{ T }}
custom_proxy_group=🇺🇸 美国节点`url-test`(美国|US|(^|[^A-Za-z])USA?([^A-Za-z]|$)|United States){{ T }}
custom_proxy_group=🇨🇳 台湾节点`url-test`(台湾|TW|Taiwan|CHT|Hinet){{ T }}
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|JP|Japan|Tokyo|Osaka){{ T }}
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|狮城|SG|Singapore){{ T }}

enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=base/GeneralClashConfig.yml
